<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawLogo(canvas) {
  const w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  const s = w / 100;
  ctx.strokeStyle = '#42B91D';
  ctx.lineWidth = 11 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(12*s, 88*s);
  ctx.quadraticCurveTo(50*s, 8*s, 88*s, 88*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(33*s, 62*s);
  ctx.quadraticCurveTo(50*s, 44*s, 67*s, 62*s);
  ctx.stroke();
}
const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
drawLogo(c192); drawLogo(c512);
function download(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}
download(c192, 'logo192.png');
setTimeout(()=>download(c512, 'logo512.png'), 500);
</script>
</body>
</html>
